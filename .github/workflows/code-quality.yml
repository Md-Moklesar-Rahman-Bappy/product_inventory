name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pint:
    name: Laravel Pint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, gd, zip, bcmath, xml, tokenizer, curl
          tools: laravel-pint
          coverage: none

      - name: Install Dependencies
        run: composer install --no-progress --prefer-dist --no-dev

      - name: Run Pint
        run: pint --test
